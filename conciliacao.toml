# Associa o nome de cada arquivo de Extrato ao banco e à conta (padrões no estilo glob).

[[contas]]
padrao = "*extrato_bancario*.csv"
banco = "itau"
conta = "conta-principal-cobranca"

# Encargo por atraso, contado a partir do Vencimento efetivo. Multa de 2% e juros zero são premissas ainda não
# confirmadas pelo contrato.
[encargo]
multa_percentual = 2
juros_ao_mes_percentual = 0
tolerancia_reais = 0.00

# Busca de somas de Títulos do mesmo Franqueado: quantas combinações examinar por Crédito antes de desistir.
# Atingido o limite, o Crédito vai para a Fila como "mais de uma combinação possível".
[somas]
limite_de_combinacoes = 100000

# LLM local via Ollama que só dá parecer sobre o nome do pagador (ADR 0003). O modelo de 4B quantizado (~2,5 GB)
# cabe num MacBook Air M2 de 8 GB; a escolha está em docs/decisoes-implementacao.md ("Correção: prompt e modelo da
# IA"). Sem esta seção, os itens que precisariam de parecer ficam marcados "IA indisponível".
[ia]
endereco = "http://localhost:11434"
modelo = "qwen3:4b"
tempo_limite_segundos = 120

# Alerta do Resumo: avisa quando a parte resolvida sozinha (em quantidade ou em valor) cai mais que este número de
# pontos percentuais em relação à execução anterior. O limiar de "queda grande" ainda não foi confirmado com o cliente.
[resumo]
limite_de_queda_pontos_percentuais = 10

# Fase 2 (Cobrança identificada). Sem esta seção nada da fase 2 executa: o comando emitir-cobrancas não emite e
# arquivos de Pix recebidos e de retorno CNAB 240 são recusados. Os Franqueados migrados são dados pela raiz do CNPJ
# (8 dígitos). O arquivo de Pix recebidos da API Pix (JSON) e o retorno CNAB 240 precisam casar cada um com uma
# [[contas]] própria, que diz o banco e a conta. Em [migracao.boleto] fica a faixa de nosso número que o banco reservou
# para a plataforma na conta beneficiária (só dígitos, mesmo tamanho nos dois extremos); sem ela, os Títulos sem nosso
# número do Protheus recebem só Pix.
# [migracao]
# franqueados = ["00000000"]
#
# [migracao.boleto]
# banco = "itau"
# conta = "conta-principal-cobranca"
# nosso_numero_inicial = "0000700001"
# nosso_numero_final = "0000799999"
#
# [[contas]]
# padrao = "*pix_recebidos*.json"
# banco = "itau"
# conta = "conta-principal-cobranca"
#
# [[contas]]
# padrao = "*retorno_cnab*.ret"
# banco = "itau"
# conta = "conta-principal-cobranca"
