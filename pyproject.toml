[project]
name = "conciliacao"
version = "0.1.0"
description = "Conciliação de contas a receber da Vantara: liga cada Crédito do Extrato aos Títulos dos Franqueados."
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
]

[project.scripts]
conciliar = "conciliacao.cli:main"
conciliar-tela = "conciliacao.tela:main"
emitir-cobrancas = "conciliacao.emissao:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integracao'"
markers = ["integracao: chama serviços reais, como o Ollama; rode com -m integracao"]

[tool.mypy]
strict = true
files = ["src", "tests"]
